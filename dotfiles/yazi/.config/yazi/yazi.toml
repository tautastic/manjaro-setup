[mgr]
linemode = "none"
ratio = [1, 3, 4]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
sort_sensitive = true

[[open.prepend_rules]]
url = "*.dot"
use = ["xdot", "edit"]

[[opener.edit]]
block = true
desc = "Edit"
run = "$EDITOR %s"

[[opener.xdot]]
desc = "Open with xdot"
orphan = true
run = "xdot \"$1\""

[preview]
image_filter = "lanczos3"
image_quality = 90
max_height = 900
max_width = 600
tab_size = 1
ueberzug_offset = [0, 0, 0, 0]
ueberzug_scale = 1

[tasks]
bizarre_retry = 5
macro_workers = 10
micro_workers = 5
