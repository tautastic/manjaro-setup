# GNOME settings, loaded with `dconf load /`.
#
# Every unused keybinding is explicitly set to an empty array rather than left
# alone, so a stock Manjaro default cannot leak through.
#


# ---------------------------------------------------------------- Appearance
[org/gnome/desktop/interface]
color-scheme='prefer-dark'
enable-hot-corners=false
clock-format='24h'
clock-show-weekday=true
clock-show-date=true

# ------------------------------------------------------ Privacy and Security
[org/gnome/desktop/privacy]
disable-camera=true
remember-recent-files=false
remove-old-trash-files=true
remove-old-temp-files=true
old-files-age=uint32 1

[org/gnome/desktop/notifications]
show-in-lock-screen=false

[org/gnome/desktop/location]
enabled=false

[org/gnome/desktop/screen-time-limits]
history-enabled=false

[org/gnome/desktop/search-providers]
disable-external=true

# -------------------------------------------------------------- Multitasking
[org/gnome/mutter]
edge-tiling=true
dynamic-workspaces=false
workspaces-only-on-primary=true

[org/gnome/desktop/wm/preferences]
num-workspaces=4

[org/gnome/shell/app-switcher]
current-workspace-only=false

# ---------------------------------------------------------- Mouse / Touchpad
[org/gnome/desktop/peripherals/mouse]
left-handed=false
accel-profile='flat'
speed=-0.15
natural-scroll=false

# ------------------------------------------------------------- Date and Time
[org/gnome/desktop/datetime]
automatic-timezone=false

[org/gtk/settings/file-chooser]
clock-format='24h'

# ------------------------------------------------------------------ Nautilus
[org/gnome/nautilus/list-view]
default-column-order=['name', 'date_modified', 'size', 'group', 'owner', 'permissions', 'type', 'date_created', 'date_accessed', 'recency', 'detailed_type']
default-visible-columns=['name', 'date_modified', 'size', 'permissions']
default-zoom-level='small'

[org/gnome/nautilus/preferences]
date-time-format='detailed'
default-folder-viewer='list-view'
migrated-gtk-settings=true
show-create-link=true
show-delete-permanently=true

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true
sort-directories-first=true

# ------------------------------------------------------------- Input sources
[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'de'), ('xkb', 'ara')]
per-window=false

# ------------------------------------------------------- Custom keybindings
[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Launch Kitty'
command='kitty --start-as=maximized'
binding='<Super>Return'

