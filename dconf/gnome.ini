# ----------------------------------------------- Manjaro default suppression
# Manjaro enables a set of shell extensions and its own dash by default. These
# three keys keep that from surviving the prune, and kill the weather and
# world-clock sections of the calendar popup for good.
[org/gnome/shell]
enabled-extensions=@as []
favorite-apps=['kitty.desktop', 'librewolf.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/shell/weather]
automatic-location=false
locations=@av []

[org/gnome/shell/world-clocks]
locations=@av []
